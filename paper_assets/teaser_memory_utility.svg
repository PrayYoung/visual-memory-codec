<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Visual Memory Codec: compact memory utility summary</title>
  <desc id="desc">Text, visual latent, hybrid, and WebP memories are compared under fixed byte budgets by downstream question answering. At four kilobytes, visual latent memory is 0.034 QA above WebP. At eight kilobytes it underfills and plateaus while WebP reaches 0.504 QA.</desc>
  <style>
    .h { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #14213d }
    .sh { font: 600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #425466 }
    .label { font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #14213d }
    .body { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #425466 }
    .small { font: 600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #425466 }
    .value { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #14213d }
  </style>
  <rect width="1200" height="620" rx="26" fill="#f8fafc"/>
  <rect x="1" y="1" width="1198" height="618" rx="25" fill="none" stroke="#d9e2ec" stroke-width="2"/>
  <text x="58" y="67" class="h">Compact visual memory, measured by answerable information</text>
  <text x="58" y="98" class="sh">Fixed byte caps → stored representation → downstream scene-QA utility</text>

  <rect x="58" y="142" width="184" height="206" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="82" y="178" class="label">IMAGE</text>
  <rect x="82" y="198" width="136" height="104" rx="10" fill="#dceef2"/>
  <circle cx="118" cy="231" r="18" fill="#54c6b9"/>
  <path d="M83 301l42-45 29 27 23-22 41 40z" fill="#4267a9"/>
  <text x="82" y="326" class="body">one visual observation</text>

  <path d="M262 245h53" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M306 235l14 10-14 10" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="334" y="128" width="430" height="234" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="358" y="164" class="label">FIXED STORAGE BUDGET</text>
  <text x="358" y="189" class="small">Compare representations using actual stored bytes</text>
  <rect x="358" y="214" width="178" height="54" rx="11" fill="#f1f5f9"/>
  <rect x="554" y="214" width="178" height="54" rx="11" fill="#e8f7f5"/>
  <rect x="358" y="282" width="178" height="54" rx="11" fill="#f1f5f9"/>
  <rect x="554" y="282" width="178" height="54" rx="11" fill="#eef2ff"/>
  <text x="378" y="247" class="label">Text</text>
  <text x="574" y="247" class="label">Visual latent</text>
  <text x="378" y="315" class="label">Hybrid</text>
  <text x="574" y="315" class="label">WebP</text>

  <path d="M784 245h53" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M828 235l14 10-14 10" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="856" y="142" width="286" height="206" rx="18" fill="#14213d"/>
  <text x="882" y="179" style="font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc">DOWNSTREAM QA</text>
  <text x="882" y="211" style="font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1">Which memory preserves</text>
  <text x="882" y="234" style="font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1">usable visual information?</text>
  <rect x="882" y="261" width="177" height="48" rx="10" fill="#54c6b9"/>
  <text x="902" y="292" style="font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#14213d">scene-QA accuracy</text>

  <rect x="58" y="405" width="514" height="154" rx="18" fill="#e8f7f5" stroke="#a9ded7" stroke-width="2"/>
  <text x="84" y="442" class="label">NOMINAL 4 KB ARM</text>
  <text x="84" y="477" class="value">Visual latent − WebP: +0.034 QA</text>
  <text x="84" y="506" class="body">paired 95% CI [+0.009, +0.059]</text>
  <text x="84" y="536" class="small">Latent 0.503 at 3,928 B  •  WebP 0.469 at 3,452 B</text>

  <rect x="598" y="405" width="544" height="154" rx="18" fill="#fff7e8" stroke="#f2d39b" stroke-width="2"/>
  <text x="624" y="442" class="label">NOMINAL 8 KB PLATEAU CHECK</text>
  <text x="624" y="477" class="value">No latent advantage at the higher-rate arm</text>
  <text x="624" y="506" class="body">Latent stays at 3.93 KB / 0.503 QA; WebP reaches 0.504 QA.</text>
  <text x="624" y="536" class="small">Latent underfills the cap and plateaus; paired difference −0.002 [−0.024, +0.021]</text>
</svg>
